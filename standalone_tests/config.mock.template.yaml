# Template — do not use directly. Generated by Dockerfile.test (Docker) or
# test_local_mock.py (local). Placeholders: {python}, {mock_script}.

mode: "command-wrapper"
transport: "stdio"

groups:
  wp_safety:
    forbidden_patterns:
      - "--exec"
      - "--require"
      - "--ssh"
      - "--http"

wrapped_commands:
  - name: "wp_core"
    description: "Check WordPress core version, available updates, and file integrity."
    command: ["{python}", "-u"]
    apply: [wp_safety]
    allowed_args:
      - "{mock_script} core version"
      - "{mock_script} core check-update"
    timeout: 60

  - name: "wp_plugin"
    description: "List, activate, deactivate, update, and inspect plugins."
    command: ["{python}", "-u"]
    apply: [wp_safety]
    forbidden_args:
      - "{mock_script} plugin delete"
      - "{mock_script} plugin install"
    timeout: 60

  - name: "wp_db"
    description: "Inspect database integrity and table sizes."
    command: ["{python}", "-u"]
    apply: [wp_safety]
    allowed_args:
      - "{mock_script} db check"
      - "{mock_script} db tables"
    timeout: 120
